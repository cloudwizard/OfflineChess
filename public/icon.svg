<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Texture -->
  <path d="M 64 0 L 64 512 M 128 0 L 128 512 M 192 0 L 192 512 M 256 0 L 256 512 M 320 0 L 320 512 M 384 0 L 384 512 M 448 0 L 448 512" stroke="#1e293b" stroke-width="1.5" stroke-opacity="0.3"/>
  <path d="M 0 64 L 512 64 M 0 128 L 512 128 M 0 192 L 512 192 M 0 256 L 512 256 M 0 320 L 512 320 M 0 384 L 512 384 M 0 448 L 512 448" stroke="#1e293b" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Outer Neon Pocket Shield -->
  <path d="M 120 128 Q 256 96 392 128 Q 392 288 256 424 Q 120 288 120 128 Z" fill="#111827" stroke="url(#cyanGrad)" stroke-width="6" stroke-opacity="0.8"/>

  <!-- Stylized Geometric Chess Knight -->
  <!-- Mane and head -->
  <path d="M 210 160 C 230 150 280 155 304 185 C 316 200 320 224 316 242 L 340 254 L 324 286 L 298 274 C 288 296 270 316 242 324 L 230 310 C 248 304 262 288 266 270 C 248 268 238 258 232 242 C 224 220 236 195 244 185 C 234 188 222 196 216 208 C 212 192 210 176 210 160 Z" fill="url(#emeraldGrad)" filter="url(#neonGlow)"/>

  <!-- Knight Base -->
  <rect x="184" y="340" width="144" height="20" rx="8" fill="url(#emeraldGrad)"/>
  <rect x="204" y="322" width="104" height="14" rx="6" fill="#34d399" opacity="0.9"/>
  <rect x="168" y="364" width="176" height="24" rx="10" fill="#059669"/>

  <!-- Eye accent -->
  <circle cx="282" cy="208" r="7" fill="#f8fafc"/>
  <circle cx="284" cy="207" r="3" fill="#0f172a"/>

  <!-- Pocket Emblem line -->
  <path d="M 200 398 Q 256 414 312 398" stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>
</svg>
